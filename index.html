<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<title>Para você</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;height:100vh;width:100vw;touch-action:none}
#stage{position:absolute;inset:0;background:#000;touch-action:none;perspective:1000px}
#orbit{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
#stars{position:absolute;inset:-50%;width:200%;height:200%}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1;box-shadow:0 0 10px #fff}}
.cloud{position:absolute;background:radial-gradient(ellipse,rgba(255,255,255,0.16) 0%,rgba(180,180,200,0.07) 50%,transparent 70%);border-radius:50%;filter:blur(25px)}
#moon{position:absolute;left:50%;top:50%;width:88vw;max-width:500px;aspect-ratio:1/1;border-radius:50%;overflow:hidden;transform:translate(-50%,-50%);box-shadow:0 0 80px rgba(255,255,255,0.15)}
#moon img{width:100%;height:100%;object-fit:cover;display:block}
#phrase{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);color:#f5f3ef;text-align:center;z-index:30;width:82%;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:21px;line-height:1.7;letter-spacing:0.3px;text-shadow:0 2px 20px rgba(0,0,0,0.9);pointer-events:none}
#hint{position:absolute;top:25px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.35);font-size:9px;letter-spacing:3px;font-family:sans-serif;z-index:30}
</style>
</head>
<body>
<div id="stage">
  <div id="orbit">
    <div id="stars"></div>
    <div class="cloud" style="width:600px;height:300px;left:5%;top:30%"></div>
    <div class="cloud" style="width:800px;height:400px;left:30%;top:45%"></div>
    <div class="cloud" style="width:500px;height:250px;left:65%;top:25%"></div>
  </div>
  <div id="moon"><img src="IMG_3011.jpeg"></div>
  <div id="phrase">Eu achava que a lua era linda, que as estrelas brilhavam e que o céu era infinito. Aí você chegou e eu entendi: eu só estava aprendendo a te enxergar em tudo.</div>
  <div id="hint">ARRASTE PARA GIRAR 360º • PINÇA PARA ZOOM</div>
</div>
<script>
const stars=document.getElementById('stars');
for(let i=0;i<200;i++){let s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*4+'s';s.style.animationDuration=(1+Math.random()*3)+'s';let size=1+Math.random()*2.5;s.style.width=size+'px';s.style.height=size+'px';stars.appendChild(s)}

const orbit=document.getElementById('orbit');
const moon=document.getElementById('moon');
let rotY=0,rotX=0,scale=1,lastScale=1,startX=0,startY=0,lastRotY=0,lastRotX=0,initialDist=0;
function update(){orbit.style.transform=`rotateY(${rotY}deg) rotateX(${rotX}deg) scale(${scale})`; moon.style.transform=`translate(-50%,-50%) scale(${scale})`}
function getDist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
const stage=document.getElementById('stage');
stage.addEventListener('touchstart',e=>{
  if(e.touches.length==1){startX=e.touches[0].clientX-lastRotY;startY=e.touches[0].clientY-lastRotX}
  if(e.touches.length==2){initialDist=getDist(e.touches);lastScale=scale}
},{passive:false});
stage.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length==1){
    lastRotY=e.touches[0].clientX-startX;
    lastRotX=e.touches[0].clientY-startY;
    rotY=lastRotY*0.3; rotX=Math.max(-30,Math.min(30,lastRotX*0.15));
    update();
  }
  if(e.touches.length==2){
    let d=getDist(e.touches);
    scale=Math.min(Math.max(0.6,lastScale*(d/initialDist)),3.5);
    lastScale=scale; update();
  }
},{passive:false});
stage.addEventListener('wheel',e=>{scale=Math.min(Math.max(0.6,scale+e.deltaY*-0.001),3.5);update()},{passive:true});
update();
</script>
</body>
</html>
