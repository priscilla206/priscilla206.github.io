<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>my-stargazing.github.io</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;1,300&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#040a1a; overflow:hidden; height:100vh; width:100vw; font-family:'Inter',sans-serif; cursor:grab; touch-action:none;}
  body:active{cursor:grabbing}
  #sky{position:absolute; inset:0; overflow:hidden; transform:translate(0,0); will-change:transform}
  .stars-layer{position:absolute; inset:-20%; background-image:
    radial-gradient(1px 1px at 10% 20%, white, transparent),
    radial-gradient(1.2px 1.2px at 30% 80%, white, transparent),
    radial-gradient(1px 1px at 50% 30%, white, transparent),
    radial-gradient(1.5px 1.5px at 80% 10%, #fff, transparent),
    radial-gradient(1px 1px at 90% 70%, white, transparent);
    background-size: 550px 550px; opacity:0.9}
  #stars1{opacity:0.6}
  #stars2{opacity:0.9; background-size:350px 350px}
  #stars3{opacity:1}
  #moon-container{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width: min(55vw, 420px); aspect-ratio:1; border-radius:50%; overflow:hidden; box-shadow: 0 0 80px rgba(255,255,200,0.25), 0 0 150px rgba(255,255,200,0.15), inset -20px -10px 40px rgba(0,0,0,0.6); will-change:transform}
  #moon{width:100%; height:100%; background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg'); background-size:cover; background-position:center; filter:brightness(1.1) contrast(1.1); transition:transform 0.1s}
  .header{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:22px 36px; z-index:10; color:#8a90a0; font-size:11px; letter-spacing:0.1em}
  .header a{color:#8a90a0; text-decoration:none; margin-left:8px}
  .footer{position:absolute; bottom:0; left:0; right:0; padding:18px 36px; z-index:10; color:#5a6070; font-size:9px; letter-spacing:0.08em}
  .caption{position:absolute; bottom:12%; left:50%; transform:translateX(-50%); width:90%; max-width:720px; text-align:center; z-index:10; pointer-events:none}
  .caption p{font-family:'Crimson Pro',serif; font-style:italic; font-weight:300; color:#e8e8ea; font-size: clamp(14px, 1.8vw, 18px); line-height:1.6; text-shadow:0 2px 20px rgba(0,0,0,0.8)}
  #hint{position:absolute; bottom:28%; left:50%; transform:translateX(-50%); color:#3a4050; font-size:10px; letter-spacing:0.2em; z-index:10; pointer-events:none; opacity:0.7; animation: fadeOut 4s forwards 3s}
  @keyframes fadeOut{to{opacity:0}}
</style>
</head>
<body>
  <div id="sky">
    <div id="stars1" class="stars-layer"></div>
    <div id="stars2" class="stars-layer"></div>
    <div id="stars3" class="stars-layer"></div>
    <div id="moon-container"><div id="moon"></div></div>
  </div>
  <div class="header">
    <div style="display:flex; align-items:center; gap:8px"><span style="font-size:16px">◍</span> my-stargazing.github.io</div>
    <div>Home • About • Contact</div>
  </div>
  <div id="hint">ARRASTE COM O DEDO ✨</div>
  <div class="caption">
    <p>Eu achava que a lua era linda, que as estrelas brilhavam e que o céu era infinito.<br>Aí você chegou e eu entendi: eu só estava aprendendo a te enxergar em tudo.</p>
  </div>
  <div class="footer">Published with GitHub Pages • Theme: dark-night • 2024</div>

<script>
let startX=0, startY=0, curX=0, curY=0, targetX=0, targetY=0;

const stars1=document.getElementById('stars1');
const stars2=document.getElementById('stars2');
const stars3=document.getElementById('stars3');
const moonC=document.getElementById('moon-container');
let isDragging=false;

  curY += (targetY - curY)*0.08;
