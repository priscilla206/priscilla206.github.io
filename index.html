<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Céu</title>
<style>
  body{margin:0;overflow:hidden;background:radial-gradient(ellipse at bottom,#1B2735 0%,#090A0F 100%);height:100vh;font-family:'Georgia',serif;display:flex;justify-content:center;align-items:center;}
  .stars{position:fixed;top:0;left:0;width:100%;height:100%;}
  .star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;animation:twinkle 3s infinite ease-in-out;}
  @keyframes twinkle{0%,100%{opacity:0.2;transform:scale(1);}50%{opacity:1;transform:scale(1.5);}}
  .moon{position:absolute;top:15%;left:50%;transform:translateX(-50%);width:150px;height:150px;background:radial-gradient(circle at 35% 35%,#f5f3ce,#e6e2b3 20%,#c2b280 40%,#8a7f5a 70%);border-radius:50%;box-shadow:0 0 40px 15px rgba(255,255,220,0.4),0 0 80px 30px rgba(255,255,200,0.15),inset -15px -15px 30px rgba(0,0,0,0.4);z-index:2;}
  .crater{position:absolute;background:rgba(0,0,0,0.15);border-radius:50%;box-shadow:inset 2px 2px 5px rgba(0,0,0,0.3);}
  .crater1{width:25px;height:25px;top:30px;left:35px;} .crater2{width:18px;height:18px;top:60px;left:80px;} .crater3{width:12px;height:12px;top:90px;left:40px;} .crater4{width:30px;height:30px;top:75px;left:20px;opacity:0.6;}
  .clouds{position:absolute;width:200%;height:100%;z-index:3;pointer-events:none;}
  .cloud{position:absolute;background:rgba(255,255,255,0.08);border-radius:50px;filter:blur(15px);animation:drift linear infinite;}
  .c1{width:250px;height:60px;top:20%;animation-duration:60s;} .c2{width:300px;height:80px;top:45%;animation-duration:80s;animation-delay:-20s;} .c3{width:200px;height:50px;top:70%;animation-duration:70s;animation-delay:-10s;}
  @keyframes drift{from{left:-40%;}to{left:100%;}}
  .message{position:relative;z-index:5;text-align:center;color:white;margin-top:250px;padding:25px;animation:fadeIn 4s ease-in;max-width:90%;}
  .message h1{font-size:1.5rem;font-weight:300;line-height:1.4;text-shadow:0 0 10px rgba(255,255,255,0.8);margin:0;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="moon"><div class="crater crater1"></div><div class="crater crater2"></div><div class="crater crater3"></div><div class="crater crater4"></div></div>
  <div class="clouds"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
  <div class="message">
    <h1>Eu passava horas admirando a lua, as estrelas e o céu...<br>e agora percebo que tudo isso sempre foi só um ensaio pra te admirar.</h1>
  </div>
<script>
  const container=document.getElementById('stars');
  for(let i=0;i<150;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';s.style.animationDuration=(2+Math.random()*3)+'s';container.appendChild(s);}
</script>
</body>
</html>
