<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>my-stargazing.github.io</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#020814; overscroll-behavior:none}
  body{font-family:'Inter',sans-serif; touch-action:none; user-select:none}
  
  #world{position:absolute; inset:-30%; will-change:transform}
  
  canvas#stars{position:absolute; inset:0; width:100%; height:100%}
  
  #moon-wrap{
    position:absolute; left:50%; top:50%; width: clamp(280px, 42vw, 460px); aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background: #0a0a0a;
    overflow:hidden;
  }
  #moon-img{
    width:100%; height:100%; display:block;
    object-fit:cover; border-radius:50%;
    filter: brightness(1.05) contrast(1.08);
  }

  .header, .footer{position:fixed; left:0; right:0; z-index:20; display:flex; justify-content:space-between; padding:20px 28px; color:#7e8598; font-size:11px; letter-spacing:0.12em; pointer-events:none}
  .header{top:0} .footer{bottom:0; font-size:9px; color:#4f5668}

  .caption{
    position:fixed; bottom:11%; left:50%; transform:translateX(-50%);
    width:92%; max-width:700px; text-align:center; z-index:20; pointer-events:none
  }
  .caption p{
    font-family:'Crimson Pro', serif; font-style:italic; font-weight:300;
    color:#e9e9ee; font-size: clamp(15px, 1.9vw, 19px); line-height:1.7;
    text-shadow:0 1px 20px rgba(0,0,0,1)
  }
</style>
</head>
<body>
<div id="world">
  <canvas id="stars"></canvas>
  <div id="moon-wrap">
    <img id="moon-img" src="https://images.unsplash.com/photo-1522030299830-16b8d3d04971?q=80&w=800&auto=format&fit=crop" alt="lua">
  </div>
</div>

<div class="header"><div>◍ my-stargazing.github.io</div><div>Home • About • Contact</div></div>
