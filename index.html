<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;overflow:hidden;height:100vh;width:100vw}
#estrelas{position:fixed;inset:0}
.e{position:absolute;background:#fff;border-radius:50%;animation:p 3s infinite}
@keyframes p{0%,100%{opacity:.2}50%{opacity:1;box-shadow:0 0 6px #fff}}
#lua{position:fixed;left:50%;top:40%;width:85vw;max-width:450px;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden}
#lua img{width:115%;height:115%;object-fit:cover;transform:translate(-6%,-6%)}
#frase{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);width:85%;color:#f5f3f0;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;line-height:1.6}
.cad{position:fixed;width:120px;height:1.5px;background:linear-gradient(to right,white,transparent);animation:c 3s linear infinite;opacity:0}
@keyframes c{0%{transform:translate(-150px,0) rotate(-30deg);opacity:0}10%{opacity:1}100%{transform:translate(120vw,70vh) rotate(-30deg);opacity:0}}
</style>
</head>
<body>
<div id="estrelas"></div>
<div class="cad" style="top:18%"></div>
<div class="cad" style="top:28%;animation-delay:1.2s"></div>
<div class="cad" style="top:12%;animation-delay:2.7s"></div>
<div id="lua"><img src="IMG_3011.jpeg"></div>
<div id="frase">Eu achava que a lua era linda, que as estrelas brilhavam e que o céu era infinito. Aí você chegou e eu entendi: eu só estava aprendendo a te enxergar em tudo.</div>
<script>
let es=document.getElementById('estrelas');
for(let i=0;i<400;i++){let d=document.createElement('div');d.className='e';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';let t=0.8+Math.random()*2.2;d.style.width=t+'px';d.style.height=t+'px';d.style.animationDelay=Math.random()*4+'s';es.appendChild(d)}
let x=0,y=0,lx=0,ly=0,sx=0,sy=0,sc=1;
let lua=document.getElementById('lua');
function up(){es.style.transform=`translate(${x}px,${y}px) scale(${sc})`;lua.style.transform=`translate(-50%,-50%) translate(${x*0.3}px,${y*0.3}px) scale(${sc})`}
addEventListener('touchstart',e=>{sx=e.touches[0].clientX-lx;sy=e.touches[0].clientY-ly},{passive:false});
addEventListener('touchmove',e=>{e.preventDefault();lx=e.touches[0].clientX-sx;ly=e.touches[0].clientY-sy;x=lx;y=ly;up()},{passive:false});
</script>
</body>
</html>
