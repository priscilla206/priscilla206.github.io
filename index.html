<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;height:100vh;width:100vw;touch-action:none}
#stage{position:fixed;inset:0;background:#000;touch-action:none}
#world{position:absolute;left:50%;top:45%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
#stars{position:absolute;left:-150vw;top:-150vh;width:300vw;height:300vh}
.star{position:absolute;background:#fff;border-radius:50%}
#lua{position:absolute;left:50%;top:50%;width:85vw;max-width:420px;height:85vw;max-height:420px;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:#111}
#lua img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.shoot{position:fixed;width:150px;height:2px;background:linear-gradient(90deg,white,transparent);pointer-events:none;z-index:10}
@keyframes fall{0%{transform:translate3d(-20vw,-20vh,0) rotate(-35deg);opacity:0}10%{opacity:1}100%{transform:translate3d(120vw,120vh,0) rotate(-35deg);opacity:0}}
#frase{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:85%;text-align:center;color:#fff;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;line-height:1.6;z-index:20;text-shadow:0 2px 10px #000}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="stars"></div>
    <div id="lua"><img src="IMG_3011.jpeg" id="moonImg"></div>
  </div>
  <div class="shoot" style="top:10
