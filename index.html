<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=10">
<title>Para você</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;height:100vh;width:100vw;font-family:Georgia,serif;touch-action:none}
#stage{position:absolute;inset:0;background:#000;touch-action:none}
#stars{position:absolute;inset:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1;box-shadow:0 0 8px #fff}}
.cloud{position:absolute;background:radial-gradient(ellipse at center,rgba(255,255,255,0.18) 0%,rgba(200,200,220,0.1) 40%,transparent 70%);border-radius:50%;filter:blur(22px);animation:drift 18s infinite alternate ease-in-out}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-25px) scale(1.25)}}
#moonWrap{position:absolute;left:50%;top:50%;will-change:transform;transform-origin:center center}
#moon{width:92vw;max-width:520px;aspect-ratio:1/1;border-radius:50%;overflow:hidden}
#moon img{width:100%;height:100%;object-fit:cover;display:block}
#phrase{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);color:#fff;text-align:center;z-index:20;width:85%;font-size:17px;line-height:1.6;letter-spacing:.3px;text-shadow:0 2px 15px #000;pointer-events:none}
#hint{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.45);font-size:10px;letter-spacing:2px;font-family:sans-serif;z-index:20}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div class="cloud" style="width:450px;height:220px;left:5%;top:42%"></div>
  <div class="cloud" style="width:600px;height:300px;left:35%;top:48%;animation-delay:-6s"></div>
  <div class="cloud" style="width:350px;height:200px;left:60%;top:38%;animation-delay:-11s"></div>
  <div id="moonWrap"><div id="moon"><img src="IMG_3011.jpeg"></div></div>
  <div id="phrase">Eu achava que a lua era linda, que as estrelas brilhavam e que o céu era infinito. Aí você chegou e eu entendi: eu só estava aprendendo a te enxergar em tudo.</div>
  <div id="hint">2 DEDOS ZOOM • 1 DEDO ARRASTAR</div>
</div>
<script>
const stars=document.getElementById('stars');
for(let i=0;i<80;i++){let s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';stars.appendChild(s)}
const wrap=document.getElementById('moonWrap');
let scale=1,lastScale=1,posX=0,posY=0,lastX=0,lastY=0,startX=0,startY=0,initialDist=0;
function getDist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
function update(){wrap.style.transform=`translate(-50%,-50%) translate(${posX}px,${posY}px) scale(${scale})`}
const stage=document.getElementById('stage');
stage.addEventListener('touchstart',e=>{
  if(e.touches.length==1){startX=e.touches[0].clientX-lastX;startY=e.touches[0].clientY-lastY}
  if(e.touches.length==2){initialDist=getDist(e.touches);lastScale=scale}
},{passive:false});
stage.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length==1){lastX=e.touches[0].clientX-startX;lastY=e.touches[0].clientY-startY;posX=lastX;posY=lastY;update()}
  if(e.touches.length==2){let d=getDist(e.touches);scale=Math.min(Math.max(0.6,lastScale*(d/initialDist)),4);update()}
},{passive:false});
</script>
</body>
</html>
