<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
body{margin:0;background:black;overflow:hidden;height:100vh}
#ceu{position:fixed;inset:0;background:black}
.star{position:absolute;background:white;border-radius:50%;animation:pisca 2s infinite ease-in-out}
@keyframes pisca{0%,100%{opacity:0.2}50%{opacity:1;box-shadow:0 0 6px white}}
#lua{position:fixed;left:50%;top:42%;width:300px;height:300px;margin-left:-150px;margin-top:-150px;border-radius:50%;overflow:hidden;box-shadow:0 0 60px rgba(255,255,255,0.3);z-index:2}
#lua img{width:100%;height:100%;object-fit:cover;display:block}
#frase{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:85%;color:white;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px}
</style>
</head>
<body>
<div id="ceu"></div>
<div id="lua"><img src="IMG_3011.jpeg"></div>
<div id="frase">Eu achava que a lua era linda, que as estrelas brilhavam e que o céu era infinito. Aí você chegou e eu entendi: eu só estava aprendendo a te enxergar em tudo.</div>
<script>
var ceu = document.getElementById('ceu');
var lua = document.getElementById('lua');
for(var i=0;i<2000;i++){
  var s=document.createElement('div');
  s.className='star';
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*100+'%';
  s.style.width=(Math.random()*2+1)+'px';
  s.style.height=s.style.width;
  s.style.animationDelay=(Math.random()*4)+'s';
  s.style.animationDuration=(Math.random()*2+1)+'s';
  ceu.appendChild(s);
}
var curX=0, curY=0, startX=0, startY=0;
document.addEventListener('touchstart',function(e){
  startX=e.touches[0].clientX-curX;
  startY=e.touches[0].clientY-curY;
});
document.addEventListener('touchmove',function(e){
  curX=e.touches[0].clientX-startX;
  curY=e.touches[0].clientY-startY;
  ceu.style.transform='translate('+curX*0.1+'px,'+curY*0.1
