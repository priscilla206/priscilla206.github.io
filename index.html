<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<title>Para você</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;height:100vh;width:100vw;touch-action:none}
#stage{position:absolute;inset:0;background:#000}
#world{position:absolute;left:50%;top:45%;width:1px;height:1px;will-change:transform}
#stars{position:absolute;left:-150vw;top:-150vh;width:300vw;height:300vh}
.star{position:absolute;background:#fff;border-radius:50%;animation:t 2s infinite}
@keyframes t{0%,100%{opacity:.15}50%{opacity:1;box-shadow:0 0 6px #fff}}
.shoot{position:absolute;width:120px;height:1px;background:linear-gradient(90deg,#fff,transparent);animation:shoot 4s infinite;opacity:0}
@keyframes shoot{0%{transform:translate(-200px,-200px) rotate(-30deg);opacity:0}5%{opacity:1}20%{transform:translate(800px,500px) rotate(-30deg);opacity:0}100%{opacity:0}}
#moon{position:absolute;left:50%;top:50%;width:82vw;max-width:480px;aspect-ratio:1/1;border-radius:50%;overflow:hidden;transform:translate(-50%,-50%);box-shadow:0 0 60px rgba(255,255,255,.2)}
#moon img{width:100%;height:100%;object-fit:cover;display:block}
#phrase{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:86%;color:#f2efe9;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;line-height:1.6;text-shadow:0 2px 15px #000}
</style>
</head>
<body>

<div id="world">
<div id="stars"></div>

<div class="shoot" style="top:30%;left:20%;animation-delay:2.5s"></div>
<div class="shoot" style="top:5%;left:40%;animation-delay:5s"></div>
<div id="moon"><img src="IMG_3011.jpeg"></div>
</div>

</div>
