<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<title>Para você</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;height:100vh;width:100vw;touch-action:none}#stage{position:absolute;inset:0;background:#000}#world{position:absolute;left:50%;top:45%;width:1px;height:1px;will-change:transform}#stars{position:absolute;left:-150vw;top:-150vh;width:300vw;height:300vh}.star{position:absolute;background:#fff;border-radius:50%;animation:t 3s infinite}@keyframes t{0%,100%{opacity:.2}50%{opacity:1}}#moon{position:absolute;left:50%;top:50%;width:88vw;max-width:500px;aspect-ratio:1/1;border-radius:50%;overflow:hidden;transform:translate(-50%,-50%)}#moon img{width:100%;height:100%;object-fit:cover}#phrase{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);color:#f2efe9;text-align:center;width:85%;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;line-height:1.6}</style>
</head>
<body>
<div id="stage"><div id="world"><div id="stars"></div><div id="moon"><img src="IMG_3011.jpeg"></div></div><div id="phrase">Eu achava que a lua era linda, que as estrelas brilhavam e que o céu era infinito. Aí você chegou e eu entendi: eu só estava aprendendo a te enxergar em tudo.</div></div>
<script>
const s=document.getElementById('stars');for(let i=0;i<220;i++){let d=document.createElement('div');d.className='star';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';let z=1+Math.random()*2;d.style.width=z+'px';d.style.height=z+'px';d.style.animationDelay=Math.random()*3+'s';s.appendChild(d)}
const w=document.getElementById('world');let ry=0,rx=0,sc=1,ls=1,sx=0,sy=0,lry=0,lrx=0,id=0;function u(){w.style.transform=`rotateY(${ry}deg) rotateX(${rx}deg) scale(${sc})`}function gd(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}const st=document.getElementById('stage');st.addEventListener('touchstart',e=>{if(e.touches.length==1){sx=e.touches[0].clientX-lry;sy=e.touches[0].clientY-lrx}if(e.touches.length==2){id=gd(e.touches);ls=sc}},{passive:false});st.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length==1){lry=e.touches[0].clientX-sx;lrx=e.touches[0].clientY-sy;ry=lry*0.35;rx=Math.max(-40,Math.min(40,lrx*0.2));u()}if(e.touches.length==2){let d=gd(e.touches);sc=Math.min(Math.max(0.5,ls*(d/id)),3.2);u()}},{passive:false});
</script>
</body>
</html>
