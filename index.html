<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para você</title>
<style>
  body {
    margin:0; height:100vh; background:#050a1a; display:flex; align-items:center; justify-content:center; overflow:hidden; font-family: Georgia, serif; color:white;
  }
  .stars {
    position:absolute; width:100%; height:100%; top:0; left:0;
  }
  .star { position:absolute; background:white; border-radius:50%; animation: twinkle 2s infinite alternate; }
  @keyframes twinkle { from { opacity:0.2; } to { opacity:1; } }
  .moon {
    width:180px; height:180px; background:radial-gradient(circle at 30% 30%, #fefefe, #d9d9d9 60%, #a8a8a8); border-radius:50%; position:relative; box-shadow: 0 0 60px rgba(255,255,255,0.6), 0 0 100px rgba(255,255,255,0.3); margin:0 auto 40px;
  }
  .crater { position:absolute; background:rgba(0,0,0,0.15); border-radius:50%; }
  .c1 { width:25px; height:25px; top:30px; left:40px; }
  .c2 { width:18px; height:18px; top:70px; left:100px; }
  .c3 { width:30px; height:30px; top:110px; left:30px; }
  .c4 { width:12px; height:12px; top:50px; left:110px; }
  .container { text-align:center; z-index:2; padding:20px; max-width:600px; }
  h1 { font-weight:300; font-style:italic; line-height:1.6; font-size:22px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
  .heart { color:#ff6b81; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { transform:scale(1); } 50% { transform:scale(1.2); } 100% { transform:scale(1); } }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="container">
    <div class="moon">
      <div class="crater c1"></div>
      <div class="crater c2"></div>
      <div class="crater c3"></div>
      <div class="crater c4"></div>
    </div>
    <h1>"Eu passava horas admirando a lua, as estrelas e o céu... e agora percebo que tudo isso sempre foi só um ensaio pra te admirar." <br><br><span class="heart">♥</span></h1>
  </div>
<script>
  const starsContainer = document.getElementById('stars');
  for(let i=0;i<150;i++){
    const star = document.createElement('div');
    star.className='star';
    star.style.left=Math.random()*100+'%';
    star.style.top=Math.random()*100+'%';
    star.style.width=star.style.height=(Math.random()*2+1)+'px';
    star.style.animationDelay=Math.random()*2+'s';
    starsContainer.appendChild(star);
  }
</script>
</body>
</html>
