<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;height:100vh;width:100vw;touch-action:none}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0a0a14 0%,#000 80%);touch-action:none;perspective:1000px}
#world{position:absolute;left:50%;top:45%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
#stars{position:absolute;left:-150vmax;top:-150vmax;width:300vmax;height:300vmax;transform-style:preserve-3d;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;box-shadow:0 0 4px #fff}
#lua{position:absolute;left:50%;top:50%;width:82vw;max-width:400px;height:82vw;max-height:400px;transform:translate3d(-50%,-50%,0);border-radius:50%;overflow:hidden;box-shadow:0 0 80px rgba(255,255,255,0.15), inset 0 0 30px rgba(0,0,0,0.8)}
#lua img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
