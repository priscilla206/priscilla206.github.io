<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Para você</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;height:100vh;width:100vw;touch-action:none}
#stage{position:absolute;inset:0;background:#000;touch-action:none}
#world{position:absolute;left:50%;top:45%;width:1px;height:1px;transform-style:preserve-3d;will-change:transform}
#stars{position:absolute;left:-150vw;top:-150vh;width:300vw;height:300vh;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1;box-shadow:0 0 8px #fff}}
#moon{position:absolute;left:50%;top:50%;width:88vw;max-width:500px;aspect-ratio:1/1;border-radius:50%;overflow:hidden;transform:translate(-50%,-50%);will-change:transform}
#moon img{width:100%;height:100%;object-fit:cover;display:block}
#phrase{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);color:#f2efe9;text-align:center;z-index:20;width:85%;max-width:380px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:20px;line-height:1.6;text-shadow:0 2px 20px rgba
