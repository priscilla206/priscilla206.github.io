<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=10">
<title>Para você</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;height:100vh;width:100vw;font-family:Georgia,serif;touch-action:none}
#stage{position:absolute;inset:0;background:#000;touch-action:none}
#stars{position:absolute;inset:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1;box-shadow:0 0 8px #fff}}
.cloud{position:absolute;background:radial-gradient(ellipse at center,rgba(255,255,255,0.18) 0%,rgba(200,200,220,0.1) 40%,transparent 70%);border-radius:50%;filter:blur(22px);animation:drift 18s infinite alternate ease-in-out}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-25px) scale(1.25)}}
#moonWrap{position:absolute;left:50%;top:50%;will-change:transform;transform-origin:center center}
#moon{width:92vw;max-width:520px;aspect-ratio:1/1;border-radius:50%;overflow:hidden}
#moon img{width:100%;height:100%;object-fit:cover;display:block}
#phrase{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);color:#fff;text-align:center;z-index:20;width:85%;font-size:17px;line-height:1.6;letter-spacing:.3px;text-shadow:0 2px 15px #000;pointer-events:none}
#hint{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.45);font-size:10px;letter-spacing:2px;font-family:sans-serif;z-index:20}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div class="cloud" style="width:450px;height:220px;left:5%;top:42%"></div>
  <div class
